<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table practice</title>
<style>
    table{
        border-collapse:collapse ;
    }
    td{
        border: 1px double black;
        padding: 5px 10px;
    }
    thead{
        font-size: larger;
        font-weight: bolder;
    }
</style>
</head>
<body>
    <h1>Lets practice table in html</h1>
    <table>
        <thead>
<tr>
    <td>No:</td>
    <td>Name</td>
    <td>Age</td>
    <td>Status</td>
</tr>
        </thead> 
        <tbody>
            
          <tr>
            <td>1</td>
            <td>Suraiya</td>
            <td>19</td>
            <td>married</td>
          </tr>
          <tr>
                             
            <td>2</td>
            <td>jamiul</td>
            <td>27</td>
            <td>married</td>
          </tr>
          <tr>
             <td>3</td>
            <td>Saima</td>
            <td>14</td>
            <td>unmarried</td>
          </tr>
          <tr>
            <td>4</td>
            <td>Saim</td>
            <td>14</td>
            <td>unmarried</td>
          </tr>
        </tbody>

        <tfoot>
<tr>
    <td colspan="4"> Total person: 4</td>
</tr>
        </tfoot>
    </table>
</body>
</html>
